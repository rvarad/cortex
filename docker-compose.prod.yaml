services:
  # Nginx Reverse Proxy + SSL (DuckDNS)
  swag:
    image: linuxserver/swag:latest
    container_name: swag
    mem_limit: 256m
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
      - URL=${DOMAIN_NAME}
      - SUBDOMAINS=www,
      - VALIDATION=http
    volumes:
      - ./swag_config:/config
      - ./nginx/cortex.conf:/config/nginx/site-confs/default.conf:ro
    ports:
      - "443:443"
      - "80:80"
    restart: always

  postgres-db:
    image: pgvector/pgvector:pg15
    container_name: postgres-db
    restart: always
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Database GUI (Adminer)
  db-admin:
    image: adminer:latest
    container_name: db-admin
    restart: always
    ports:
      - "127.0.0.1:8085:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:8-alpine
    container_name: redis
    mem_limit: 256m
    restart: always

  cortex-gateway:
    build:
      context: .
      dockerfile: cortex-gateway/Dockerfile
    container_name: cortex-gateway
    mem_limit: 1g
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - INTERNAL_JWT_SECRET=${INTERNAL_JWT_SECRET}
      - INGESTION_HOST=cortex-ingestion
      - RAG_HOST=cortex-rag-orchestration
      - APP_CORS_ALLOWED_ORIGINS=https://${DOMAIN_NAME}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      - redis
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  cortex-ingestion:
    build:
      context: .
      dockerfile: cortex-ingestion/Dockerfile
    container_name: cortex-ingestion
    mem_limit: 1g
    restart: always
    # Removed public port 8080 - now accessible only via Gateway
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # GCP
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME}
      # GCP credentials
      - GOOGLE_APPLICATION_CREDENTIALS=/etc/gcp/credentials.json
      - SPRING_CLOUD_GCP_CREDENTIALS_LOCATION=file:/etc/gcp/credentials.json
      - APP_JWT_SECRET=${INTERNAL_JWT_SECRET}
      # DB
      - DB_URL=jdbc:postgresql://postgres-db:5432/postgres
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      # Kafka (mTLS via mounted certs)
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL=SSL
      - SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_LOCATION=${KAFKA_SSL_TRUSTSTORE_LOCATION}
      - SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_PASSWORD=${KAFKA_SSL_TRUSTSTORE_PASSWORD}
      - SPRING_KAFKA_PROPERTIES_SSL_KEYSTORE_LOCATION=${KAFKA_SSL_KEYSTORE_LOCATION}
      - SPRING_KAFKA_PROPERTIES_SSL_KEYSTORE_PASSWORD=${KAFKA_SSL_KEYSTORE_PASSWORD}
      - SPRING_KAFKA_PROPERTIES_SSL_KEY_PASSWORD=${KAFKA_SSL_KEY_PASSWORD}
    volumes:
      - ../certs:/etc/kafka/secrets:ro
      - ../gcp-credentials.json:/etc/gcp/credentials.json:ro
    depends_on:
      - postgres-db
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  cortex-media-processing-service:
    build:
      context: .
      dockerfile: cortex-media-processing-service/Dockerfile
    container_name: cortex-media-processing-service
    mem_limit: 3g
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # GCP
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME}
      # GCP credentials
      - GOOGLE_APPLICATION_CREDENTIALS=/etc/gcp/credentials.json
      - SPRING_CLOUD_GCP_CREDENTIALS_LOCATION=file:/etc/gcp/credentials.json
      - APP_JWT_SECRET=${INTERNAL_JWT_SECRET}
      # Database
      - DB_URL=jdbc:postgresql://postgres-db:5432/postgres
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      # Kafka
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL=SSL
      - SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_LOCATION=${KAFKA_SSL_TRUSTSTORE_LOCATION}
      - SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_PASSWORD=${KAFKA_SSL_TRUSTSTORE_PASSWORD}
      - SPRING_KAFKA_PROPERTIES_SSL_KEYSTORE_LOCATION=${KAFKA_SSL_KEYSTORE_LOCATION}
      - SPRING_KAFKA_PROPERTIES_SSL_KEYSTORE_PASSWORD=${KAFKA_SSL_KEYSTORE_PASSWORD}
      - SPRING_KAFKA_PROPERTIES_SSL_KEY_PASSWORD=${KAFKA_SSL_KEY_PASSWORD}
      # AI Keys
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_BASE_URL=https://api.groq.com/openai
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ../certs:/etc/kafka/secrets:ro
      - ../gcp-credentials.json:/etc/gcp/credentials.json:ro
    depends_on:
      - postgres-db
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  cortex-rag-orchestration:
    build:
      context: .
      dockerfile: cortex-rag-orchestration/Dockerfile
    container_name: cortex-rag-orchestration
    mem_limit: 1.5g
    restart: always
    # Removed public port 8083 - now accessible only via Gateway
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # GCP
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCP_LOCATION=${GCP_LOCATION}
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME}
      # GCP credentials
      - GOOGLE_APPLICATION_CREDENTIALS=/etc/gcp/credentials.json
      - SPRING_CLOUD_GCP_CREDENTIALS_LOCATION=file:/etc/gcp/credentials.json
      - APP_JWT_SECRET=${INTERNAL_JWT_SECRET}
      # Database
      - DB_URL=jdbc:postgresql://postgres-db:5432/postgres
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      # Kafka
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL=SSL
      - SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_LOCATION=${KAFKA_SSL_TRUSTSTORE_LOCATION}
      - SPRING_KAFKA_PROPERTIES_SSL_TRUSTSTORE_PASSWORD=${KAFKA_SSL_TRUSTSTORE_PASSWORD}
      - SPRING_KAFKA_PROPERTIES_SSL_KEYSTORE_LOCATION=${KAFKA_SSL_KEYSTORE_LOCATION}
      - SPRING_KAFKA_PROPERTIES_SSL_KEYSTORE_PASSWORD=${KAFKA_SSL_KEYSTORE_PASSWORD}
      - SPRING_KAFKA_PROPERTIES_SSL_KEY_PASSWORD=${KAFKA_SSL_KEY_PASSWORD}
      # AI Keys
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_BASE_URL=https://api.groq.com/openai
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ../certs:/etc/kafka/secrets:ro
      - ../gcp-credentials.json:/etc/gcp/credentials.json:ro
    depends_on:
      - postgres-db
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  cortex-frontend:
    build:
      context: ./cortex-frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://${DOMAIN_NAME}
    container_name: cortex-frontend
    mem_limit: 1g
    restart: always
    depends_on:
      - cortex-gateway
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
