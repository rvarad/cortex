server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name _; # SWAG will handle the domain matching

    include /config/nginx/ssl.conf;

    client_max_body_size 100M; # Increase for large media uploads

    # --- Real client IP behind Cloudflare ---
    # Cloudflare terminates the visitor's TCP connection and opens a NEW one to us,
    # so $remote_addr is always a Cloudflare edge (e.g. 172.71.x). The visitor's real
    # address survives only in the CF-Connecting-IP header.
    #
    # Without this, nginx logs Cloudflare as the client, fail2ban bans Cloudflare, and
    # the whole site goes dark for everyone until the ban expires. That happened: 436x
    # "521 Origin Down" in 24h. Note 172.64.0.0/13 is PUBLIC space owned by Cloudflare —
    # it is NOT the private 172.16-172.31 block, so nothing treats it as a proxy by default.
    #
    # Ranges from https://www.cloudflare.com/ips-v4 and /ips-v6 — re-check when they change.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # --- Drop Next.js Server Action probes ---
    # Scanners spray a Next-Action header at any Next.js app, probing the known
    # Server Action CVEs. The frontend defines ZERO "use server" functions, so a
    # legitimate request can never carry this header — zero false positives.
    # 403 (not 444): an abrupt close reads as a failed origin to Cloudflare.
    if ($http_next_action) {
        return 403;
    }

    # Frontend
    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app cortex-frontend;
        set $upstream_port 3000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    # Webhook (No Auth)
    location /api/v1/webhook {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app cortex-gateway;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
        
        # Ensure no lingering auth headers interfere
        proxy_set_header Authorization "";
    }

    # API Gateway
    location /api/ {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app cortex-gateway;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
        
        # WebSocket / SSE support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
    }

    # Auth & Infrastructure Paths (Spring Security / Actuator)
    location ~ ^/(oauth2|login|auth|actuator)/ {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app cortex-gateway;
        set $upstream_port 8080;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
