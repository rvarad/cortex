spring.application.name=cortex-ingestion

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
server.error.include-message=always

# Logs
logging.pattern.level=%5p [fileId=%X{fileId}]

# Kafka Topics
app.kafka.topic.file-ingested.media=cortex.file.ingested.media
app.kafka.topic.file-ingested.document=cortex.file.ingested.document
app.kafka.topic.pipeline-events=cortex.pipeline.events

# Kafka Common
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=cortex-ingestion-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# ErrorHandlingDeserializer wraps the JSON one. Without it, a record that can't be read fails inside
# poll(): the consumer never gets past it and retries in a tight loop forever (ADR-0014).
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Database Common
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# gRPC
spring.grpc.server.port=9090

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# File Guard Rails
cortex.media.max-file-size-bytes=2147483648

# 
cortex.media.playback-url-expiry-hours=6