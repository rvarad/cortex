spring.application.name=cortex-rag-orchestration

# Logs
logging.pattern.level=%5p [fileId=%X{fileId}]

# Kafka Topics
app.kafka.topic.media=cortex.file.ingested.media
app.kafka.topic.pipeline-events=cortex.pipeline.events

# Kafka Common
spring.kafka.consumer.group-id=cortex-rag-orchestration-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Database Common
spring.jpa.hibernate.ddl-auto=validate

# AI Models (Defaults)
spring.ai.openai.audio.transcription.options.model=whisper-large-v3
spring.ai.openai.audio.transcription.options.response-format=verbose_json
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.options.task-type=RETRIEVAL_DOCUMENT
spring.ai.google.genai.embedding.text.options.dimensions=768

# Chat model selection. Required: the OpenAI starter (used for audio transcription)
# also autoconfigures a ChatModel, so without this there are two and injection is ambiguous.
# This disables the OpenAI *chat* model only; audio transcription is a hand-built bean.
spring.ai.model.chat=google-genai
spring.ai.google.genai.chat.options.model=gemini-2.5-flash

# Chat Context
chat.context.token-budget=128000

# Chat Memory. Every reader of a conversation asks the database for a fixed number of its
# newest rows; nothing loads a whole conversation. replay-rows go into every prompt (eight
# rows is four turns); recall-rows is what one recall_conversation call reads, starting just
# before the replay window; reload-rows is what GET /conversations/{id} returns.
chat.memory.replay-rows=8
chat.memory.recall-rows=20
chat.conversation.reload-rows=50
