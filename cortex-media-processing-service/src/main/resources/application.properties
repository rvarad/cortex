spring.application.name=cortex-media-processing-service

# Logs
logging.pattern.level=%5p [fileId=%X{fileId}]

# Kafka Topics
app.kafka.topic.media=cortex.file.ingested.media
app.kafka.topic.pipeline-events=cortex.pipeline.events

# Kafka Common
spring.kafka.consumer.group-id=cortex-media-processing-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# ErrorHandlingDeserializer wraps the JSON one. Without it, a record that can't be read fails inside
# poll(): the consumer never gets past it and retries in a tight loop forever (ADR-0014).
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Database Common
spring.jpa.hibernate.ddl-auto=validate

# AI Models (Defaults)
spring.ai.openai.audio.transcription.options.model=whisper-large-v3
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.options.task-type=RETRIEVAL_DOCUMENT
spring.ai.google.genai.embedding.text.options.dimensions=768

# File Guard Rails
cortex.media.max-duration-seconds=900
